<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园心理树洞</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
    #root { min-height: 100vh; display: flex; flex-direction: column; }
    
    .api-form-container, .treehole-container { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .api-form-card, .treehole-card { background: white; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 0; max-width: 500px; width: 100%; display: flex; flex-direction: column; }
    
    .logo-section { text-align: center; padding: 40px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 24px 24px 0 0; }
    .logo { width: 80px; height: 80px; background: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .logo-icon { font-size: 40px; }
    .title { font-size: 28px; font-weight: 700; color: white; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: rgba(255,255,255,0.8); }
    
    .api-form { display: flex; flex-direction: column; gap: 16px; padding: 30px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label { font-weight: 600; color: #333; font-size: 14px; }
    .api-input { padding: 14px 16px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; transition: all 0.3s ease; background: #fafafa; }
    .api-input:focus { outline: none; border-color: #667eea; background: white; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
    .api-input:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .submit-btn, .send-btn, .logout-btn, .tab-btn, .resource-btn { padding: 14px 24px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
    .submit-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .loading { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .spinner, .spinner-small { border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; }
    .spinner { width: 20px; height: 20px; }
    .spinner-small { width: 16px; height: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .error-message { background: #ffebee; color: #c62828; padding: 12px 16px; border-radius: 8px; font-size: 14px; text-align: center; }
    
    .privacy-notice { margin-top: 16px; padding: 20px; background: #f8f9fa; border-radius: 12px; }
    .privacy-notice h3 { font-size: 16px; font-weight: 600; color: #2d3748; margin-bottom: 8px; }
    .privacy-notice p { font-size: 14px; color: #666; line-height: 1.6; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 24px 24px 0 0; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .tree-icon { font-size: 28px; }
    .header h1 { font-size: 20px; font-weight: 700; color: white; margin: 0; }
    .logout-btn { background: rgba(255,255,255,0.2); color: white; padding: 8px 16px; font-size: 14px; }
    .logout-btn:hover { background: rgba(255,255,255,0.3); }
    
    .tabs { display: flex; padding: 16px 24px; gap: 12px; border-bottom: 1px solid #eee; }
    .tab-btn { background: transparent; color: #666; padding: 10px 20px; font-size: 14px; border-radius: 20px; }
    .tab-btn.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    
    .chat-container { flex: 1; overflow-y: auto; padding: 20px; max-height: 400px; }
    .messages { display: flex; flex-direction: column; gap: 16px; }
    .message { display: flex; gap: 12px; max-width: 85%; }
    .user-message { align-self: flex-end; }
    .user-message .message-content { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 16px 16px 4px 16px; }
    .ai-message { align-self: flex-start; }
    .ai-message .message-content { background: #f1f1f1; color: #333; border-radius: 16px 16px 16px 4px; }
    
    .message-avatar { width: 36px; height: 36px; border-radius: 50%; background: #e8e8e8; display: flex; justify-content: center; align-items: center; font-size: 18px; flex-shrink: 0; }
    .message-content { padding: 12px 16px; max-width: 100%; }
    .message-content p { margin: 0 0 8px 0; line-height: 1.5; font-size: 14px; }
    .message-time { font-size: 11px; opacity: 0.6; }
    
    .input-container { display: flex; gap: 12px; padding: 16px 24px; border-top: 1px solid #eee; background: #fafafa; border-radius: 0 0 24px 24px; }
    .message-input { flex: 1; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 20px; font-size: 14px; resize: none; min-height: 44px; max-height: 120px; transition: all 0.3s ease; }
    .message-input:focus { outline: none; border-color: #667eea; }
    .message-input:disabled { opacity: 0.5; }
    
    .send-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px 24px; border-radius: 20px; display: flex; align-items: center; justify-content: center; }
    .send-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .resources-container { padding: 24px; max-height: 500px; overflow-y: auto; }
    .resources-title { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
    .resources-desc { font-size: 14px; color: #666; margin-bottom: 24px; }
    .resources-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .resource-card { background: #f8f9fa; border-radius: 16px; padding: 20px; text-align: center; transition: all 0.3s ease; }
    .resource-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    .resource-icon { font-size: 32px; margin-bottom: 12px; }
    .resource-card h3 { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px; }
    .resource-card p { font-size: 12px; color: #666; margin-bottom: 12px; }
    .resource-btn { background: white; border: 1px solid #667eea; color: #667eea; padding: 8px 16px; font-size: 12px; border-radius: 20px; }
    .resource-btn:hover { background: #667eea; color: white; }
    
    .tips-section { background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%); border-radius: 16px; padding: 20px; }
    .tips-section h3 { font-size: 16px; font-weight: 600; color: #e65100; margin-bottom: 12px; }
    .tips-section ul { list-style: none; padding: 0; margin: 0; }
    .tips-section li { font-size: 14px; color: #5d4037; padding: 6px 0; }
    
    .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; color: white; font-size: 18px; z-index: 1000; }
    .loading-overlay .spinner { width: 40px; height: 40px; border-width: 3px; }
    
    @media (max-width: 600px) {
      .api-form-card, .treehole-card { margin: 10px; border-radius: 20px; }
      .logo-section { padding: 30px 20px; }
      .title { font-size: 24px; }
      .api-form { padding: 20px; }
      .resources-grid { grid-template-columns: 1fr; }
      .message { max-width: 95%; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useCallback } = React;
    
    const APIKeyForm = ({ onValidate }) => {
      const [apiKey, setApiKey] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [error, setError] = useState('');
      
      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!apiKey.trim()) {
          setError('请输入有效的 DeepSeek API Key');
          return;
        }
        setIsLoading(true);
        setError('');
        try {
          await onValidate(apiKey.trim());
        } catch (err) {
          setError('API Key 验证失败，请检查您的密钥是否正确');
        } finally {
          setIsLoading(false);
        }
      };
      
      return (
        <div className="api-form-container">
          <div className="api-form-card">
            <div className="logo-section">
              <div className="logo">
                <span className="logo-icon">🌳</span>
              </div>
              <h1 className="title">校园心理树洞</h1>
              <p className="subtitle">倾诉心事，温暖相伴</p>
            </div>
            <form onSubmit={handleSubmit} className="api-form">
              <div className="form-group">
                <label htmlFor="apiKey">DeepSeek API Key</label>
                <input
                  id="apiKey"
                  type="password"
                  value={apiKey}
                  onChange={(e) => setApiKey(e.target.value)}
                  placeholder="请输入您的 DeepSeek API Key"
                  className="api-input"
                  disabled={isLoading}
                />
              </div>
              {error && <div className="error-message">{error}</div>}
              <button type="submit" disabled={isLoading} className="submit-btn">
                {isLoading ? (
                  <span className="loading">
                    <span className="spinner"></span>
                    验证中...
                  </span>
                ) : (
                  '进入树洞'
                )}
              </button>
            </form>
            <div className="privacy-notice">
              <h3>🔒 隐私保护说明</h3>
              <p>您输入的 DeepSeek API Key 仅用于当前会话的 AI 服务调用，不会被收集、上传或存储。所有数据仅在浏览器本地处理，确保您的隐私安全。</p>
            </div>
          </div>
        </div>
      );
    };
    
    const supportResources = [
      { title: '心理咨询预约', description: '专业心理咨询师一对一服务', icon: '🧑⚕️' },
      { title: '心理测试', description: '了解自己的心理状态', icon: '📊' },
      { title: '放松音乐', description: '舒缓压力，放松心情', icon: '🎵' },
      { title: '情绪日记', description: '记录心情变化轨迹', icon: '📝' },
    ];
    
    const StoryGenerator = ({ apiKey, onLogout }) => {
      const [messages, setMessages] = useState([{
        id: '1',
        content: '你好呀！我是树洞精灵，很高兴遇见你。在这里，你可以放心倾诉任何心事，我会认真倾听并给予温暖的回应。💝',
        isUser: false,
        timestamp: new Date(),
      }]);
      const [inputValue, setInputValue] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [activeTab, setActiveTab] = useState('chat');
      
      const generateResponse = useCallback(async (prompt) => {
        setIsLoading(true);
        try {
          const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model: 'deepseek-chat',
              messages: [{
                role: 'system',
                content: `你是一位温柔、耐心、专业的心理陪伴者，名叫"树洞精灵"。请用温暖、理解和支持的语气回应用户的倾诉。

                你的职责：
                1. 认真倾听用户的烦恼和心事
                2. 给予共情和理解，避免评判
                3. 提供积极正面的建议和鼓励
                4. 引导用户看到问题的积极面
                5. 保持亲切友好的态度，使用适当的emoji表达温暖

                回应风格：
                - 温暖、关怀、支持
                - 使用温和的语言
                - 避免专业术语，用简单易懂的方式沟通
                - 每个回复不超过300字，保持简洁温馨
                - 可以使用适当的表情符号增添温暖感`
              }, {
                role: 'user',
                content: prompt
              }],
              max_tokens: 1000,
              temperature: 0.8
            })
          });
          if (!response.ok) throw new Error('API 请求失败');
          const data = await response.json();
          return data.choices[0]?.message?.content || '谢谢你的倾诉，我在这里陪伴你。💝';
        } catch (err) {
          console.error('Response generation error:', err);
          return '网络连接有点小问题，请稍后再试。我一直在这儿等你。🌙';
        } finally {
          setIsLoading(false);
        }
      }, [apiKey]);
      
      const handleSend = async () => {
        if (!inputValue.trim()) return;
        const userMessage = {
          id: Date.now().toString(),
          content: inputValue.trim(),
          isUser: true,
          timestamp: new Date(),
        };
        setMessages(prev => [...prev, userMessage]);
        setInputValue('');
        const response = await generateResponse(inputValue.trim());
        const aiMessage = {
          id: (Date.now() + 1).toString(),
          content: response,
          isUser: false,
          timestamp: new Date(),
        };
        setMessages(prev => [...prev, aiMessage]);
      };
      
      const handleKeyPress = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      };
      
      return (
        <div className="treehole-container">
          <div className="treehole-card">
            <div className="header">
              <div className="header-left">
                <span className="tree-icon">🌳</span>
                <h1>校园心理树洞</h1>
              </div>
              <button onClick={onLogout} className="logout-btn">退出</button>
            </div>
            <div className="tabs">
              <button
                className={`tab-btn ${activeTab === 'chat' ? 'active' : ''}`}
                onClick={() => setActiveTab('chat')}
              >💬 树洞聊天</button>
              <button
                className={`tab-btn ${activeTab === 'resources' ? 'active' : ''}`}
                onClick={() => setActiveTab('resources')}
              >📚 心理资源</button>
            </div>
            
            {activeTab === 'chat' && (
              <>
                <div className="chat-container">
                  <div className="messages">
                    {messages.map((message) => (
                      <div key={message.id} className={`message ${message.isUser ? 'user-message' : 'ai-message'}`}>
                        <div className="message-avatar">{message.isUser ? '😊' : '🌳'}</div>
                        <div className="message-content">
                          <p>{message.content}</p>
                          <span className="message-time">
                            {message.timestamp.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
                <div className="input-container">
                  <textarea
                    value={inputValue}
                    onChange={(e) => setInputValue(e.target.value)}
                    onKeyPress={handleKeyPress}
                    placeholder="在这里倾诉你的心事，我会认真倾听..."
                    className="message-input"
                    disabled={isLoading}
                  />
                  <button onClick={handleSend} disabled={isLoading || !inputValue.trim()} className="send-btn">
                    {isLoading ? <span className="spinner-small"></span> : '发送'}
                  </button>
                </div>
              </>
            )}
            
            {activeTab === 'resources' && (
              <div className="resources-container">
                <h2 className="resources-title">📚 心理支持资源</h2>
                <p className="resources-desc">这里有一些可以帮助你的资源，记得好好照顾自己哦~</p>
                <div className="resources-grid">
                  {supportResources.map((resource, index) => (
                    <div key={index} className="resource-card">
                      <div className="resource-icon">{resource.icon}</div>
                      <h3>{resource.title}</h3>
                      <p>{resource.description}</p>
                      <button className="resource-btn">了解更多</button>
                    </div>
                  ))}
                </div>
                <div className="tips-section">
                  <h3>💡 温馨小贴士</h3>
                  <ul>
                    <li>• 每天给自己一点时间放松</li>
                    <li>• 和信任的朋友聊聊天</li>
                    <li>• 保持规律的作息和饮食</li>
                    <li>• 不要害怕寻求帮助</li>
                  </ul>
                </div>
              </div>
            )}
            
            {isLoading && (
              <div className="loading-overlay">
                <span className="spinner"></span>
                <span>树洞精灵正在倾听...</span>
              </div>
            )}
          </div>
        </div>
      );
    };
    
    function App() {
      const [apiKey, setApiKey] = useState(null);
      const [isValidated, setIsValidated] = useState(false);
      
      const validateAPIKey = useCallback(async (key) => {
        const response = await fetch('https://api.deepseek.com/v1/models', {
          method: 'GET',
          headers: { 'Authorization': `Bearer ${key}` }
        });
        if (!response.ok) throw new Error('Invalid API Key');
        setApiKey(key);
        setIsValidated(true);
      }, []);
      
      const handleLogout = useCallback(() => {
        setApiKey(null);
        setIsValidated(false);
      }, []);
      
      if (!isValidated || !apiKey) {
        return <APIKeyForm onValidate={validateAPIKey} />;
      }
      return <StoryGenerator apiKey={apiKey} onLogout={handleLogout} />;
    }
    
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
